<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fake News Detection</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">

  <link rel="stylesheet" href="/static/index.css">
</head>

<body>
<div class="page-wrap">
  <div class="container my-5">
    <div class="card p-4 shadow-lg glass-card">
      <h1 class="text-center mb-4">Fake News Detection</h1>

      <form id="profileForm" action="/predict" method="post" autocomplete="off">
        <div class="mb-3 d-flex align-items-center gap-3">
          <label class="form-label mb-0 text-white mode-label">Input mode:</label>
          <div class="btn-group" role="group" aria-label="input mode">
            <input type="radio" class="btn-check" name="mode" id="mode-text" autocomplete="off" checked>
            <label class="btn btn-outline-light btn-sm" for="mode-text">News Text</label>

            <input type="radio" class="btn-check" name="mode" id="mode-url" autocomplete="off">
            <label class="btn btn-outline-light btn-sm" for="mode-url">News URL</label>
          </div>
        </div>

        <!-- URL INPUT -->
        <div id="url-group" class="mb-3" style="display:none;">
          <label for="url-input" class="form-label text-white">Paste article URL</label>
          <div class="input-group">
            <input id="url-input" name="url" type="url" class="form-control url-input" placeholder="https://example.com/article" />
          </div>
          <!--<div class="form-text text-muted">If Fetch fails (CORS), the URL will still be sent to your backend for processing.</div>-->
        </div>

        <!-- TEXTAREA INPUT -->
        <div id="text-group">
          <label for="news-box" class="form-label text-white fs-5">Enter your News here:</label>
          <textarea id="news-box" name="text" class="text mb-3" rows="10"
                    placeholder="Paste or type the news article here..."></textarea>
        </div>

        <div class="d-flex gap-2">
          <button type="button" id="paste-btn" class="btn btn-dark btn-outline-light btn-sm">📋 Paste</button>
          <button type="submit" class="btn predict-btn flex-grow-1">Predict</button>
        </div>
      </form>

      {% if prediction %}
      <div class="result-card mt-3">
        <p class="result-line">Prediction: <strong>{{ prediction }}</strong></p>
        <p class="result-line">Probability: <strong>{{ probability }}%</strong></p>
      </div>
      {% endif %}
    </div>
  </div>
</div>

<script>
  (function () {
    const ta = document.getElementById('news-box');
    const pasteBtn = document.getElementById('paste-btn');
    const modeText = document.getElementById('mode-text');
    const modeUrl = document.getElementById('mode-url');
    const urlGroup = document.getElementById('url-group');
    const textGroup = document.getElementById('text-group');
    const urlInput = document.getElementById('url-input');
    const fetchBtn = document.getElementById('fetch-btn');
    const form = document.getElementById('profileForm');

    function forceWhite() {
      ta.style.color = '#ffffff';
      ta.style.caretColor = '#ffffff';
      ta.style.webkitTextFillColor = '#ffffff';
    }

    // Handle mode toggle
    function setMode() {
      if (modeUrl.checked) {
        urlGroup.style.display = 'block';
        textGroup.style.display = 'none';
      } else {
        urlGroup.style.display = 'none';
        textGroup.style.display = 'block';
      }
    }

    modeText.addEventListener('change', setMode);
    modeUrl.addEventListener('change', setMode);
    setMode();

    // Paste button
    pasteBtn.addEventListener('click', async () => {
      try {
        const text = await navigator.clipboard.readText();
        if (modeUrl.checked) {
          urlInput.value = text.trim();
        } else {
          ta.value = text;
          forceWhite();
        }
      } catch (err) {
        const manual = prompt("Paste manually:");
        if (manual !== null) {
          if (modeUrl.checked) urlInput.value = manual.trim();
          else ta.value = manual;
        }
      }
      ta.focus();
    });

    // Fetch button
    fetchBtn.addEventListener('click', async () => {
      const url = (urlInput.value || "").trim();
      if (!url) {
        alert("Please paste an article URL first.");
        return;
      }
      fetchBtn.disabled = true;
      fetchBtn.innerText = "Fetching...";

      try {
        const resp = await fetch(url, { mode: 'cors' });
        if (!resp.ok) throw new Error("Fetch failed: " + resp.status);
        const html = await resp.text();

        const cleanedHtml = html.replace(/<script[\s\S]*?<\/script>/gi, '')
                                .replace(/<style[\s\S]*?<\/style>/gi, '');
        const tmp = document.createElement('div');
        tmp.innerHTML = cleanedHtml;
        let candidate = tmp.querySelector('article') || tmp.querySelector('main') || tmp.querySelector('body') || tmp;
        candidate.querySelectorAll('nav,aside,header,footer,form,iframe').forEach(n => n.remove());
        const text = candidate.innerText || candidate.textContent || '';

        alert(text.trim().length > 200 ? "Article text fetched successfully!" :
              "Could not extract sufficient text (may require server-side extraction).");

      } catch (err) {
        alert("Fetch failed (CORS or site blocked). The URL will be sent to the backend.");
      } finally {
        fetchBtn.disabled = false;
        fetchBtn.innerText = "Fetch";
      }
    });
  })();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>
</body>
</html>
