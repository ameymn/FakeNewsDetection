name: Deploy to DigitalOcean

on:
  push:
    branches: [main]
  workflow_dispatch:

# ensure workflow can create deployments
permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Deploy to DigitalOcean
        uses: digitalocean/app_action/deploy@v2
        id: do_deploy
        with:
          token: ${{ secrets.DIGITALOCEAN_TOKEN }}
          app_id: 8ca56a92-9738-49cb-8b3c-570849860fad

      - name: Create GitHub deployment (record)
        uses: chrnorm/deployment-action@v2
        id: create_deployment
        with:
          token: ${{ secrets.GH_TOKEN }}
          environment: production
          environment-url: "https://fakenews-barn3.ondigitalocean.app/"
          auto_inactive: true
